<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Boualem Larbi Djebbour (djebsoft)</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1 id="main-title">Welcome to the TV show episodes</h1>
    <header id="header">
      <h3 id="episode-count">Preparing your show...</h3>
    </header>

    <label for="show-select">Choose a show:</label>
    <select id="show-select">
      <option value="">Loading shows...</option>
    </select>

    <label for="search-input">Search episodes:</label>
    <input type="text" id="search-input" placeholder="Type to search..." />

    <label for="episode-select">Jump to episode:</label>
    <select id="episode-select">
      <option value="">All Episodes</option>
    </select>

    <main id="root"></main>

    <template id="episode-template">
      <section class="episode-card">
        <div class="episode-title"></div>
        <img src="" alt="Episode image" />
        <div class="episode-summary"></div>
      </section>
    </template>
    <footer>
      <h2>data sourced from <a href="https://tvmaze.com/">tvmaze.com</a></h2>
    </footer>

    <!-- Loads a provided function called getAllEpisodes() which returns all episodes -->
    <script src="episodes.js"></script>

    <!-- Loads my javascript code -->
    <script src="script.js"></script>
  </body>
</html>
